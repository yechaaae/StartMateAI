services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-startmate}
      MYSQL_USER: ${MYSQL_USER:-startmate}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-startmate}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-startmate}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-startmate}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-worker:
    build:
      context: ./ai
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      USE_MOCK_LLM: ${USE_MOCK_LLM:-true}
      RAG_CHROMA_PATH: ${RAG_CHROMA_PATH:-.chroma}
      RAG_EMBEDDING_DIMENSIONS: ${RAG_EMBEDDING_DIMENSIONS:-3072}
      RAG_EMBEDDING_PROVIDER: ${RAG_EMBEDDING_PROVIDER:-openai}
      SUPPORT_RAG_CHROMA_ENABLED: ${SUPPORT_RAG_CHROMA_ENABLED:-true}
      SUPPORT_RAG_CHROMA_PATH: ${SUPPORT_RAG_CHROMA_PATH:-.chroma}
      SUPPORT_RAG_CHROMA_COLLECTION: ${SUPPORT_RAG_CHROMA_COLLECTION:-support_programs}
      OPENAI_EMBEDDING_BASE_URL: ${OPENAI_EMBEDDING_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com}
      OPENAI_EMBEDDING_PATH: ${OPENAI_EMBEDDING_PATH:-/v1/embeddings}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-large}
      GMS_API_KEY: ${GMS_API_KEY:-}
      GMS_BASE_URL: ${GMS_BASE_URL:-https://gms.ssafy.io/gmsapi/api.openai.com}
      GMS_CHAT_PATH: ${GMS_CHAT_PATH:-/v1/chat/completions}
      GMS_MODEL: ${GMS_MODEL:-gpt-5.4-nano}
      GMS_API_KEY_HEADER: ${GMS_API_KEY_HEADER:-Authorization}
      GMS_API_KEY_QUERY_PARAM: ${GMS_API_KEY_QUERY_PARAM:-}
      GMS_AUTH_SCHEME: ${GMS_AUTH_SCHEME:-Bearer}
      GMS_TIMEOUT_SECONDS: ${GMS_TIMEOUT_SECONDS:-30}
      LAW_OPEN_API_OC: ${LAW_OPEN_API_OC:-}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-startmate}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-startmate}
      STARTMATE_AI_CHAT_REQUEST_QUEUE: ${STARTMATE_AI_CHAT_REQUEST_QUEUE:-chat.request}
      STARTMATE_AI_CHAT_RESPONSE_QUEUE: ${STARTMATE_AI_CHAT_RESPONSE_QUEUE:-chat.response}
      BACKEND_INTERNAL_BASE_URL: ${BACKEND_INTERNAL_BASE_URL:-http://backend:8080}
      STARTMATE_INTERNAL_TOOL_TOKEN: ${STARTMATE_INTERNAL_TOOL_TOKEN:-startmate-local-internal-token}
      BACKEND_TOOL_TIMEOUT_SECONDS: ${BACKEND_TOOL_TIMEOUT_SECONDS:-10}
    volumes:
      - ./ai/.chroma:/app/.chroma

  ai-mock:
    profiles:
      - mock-ai
    build:
      context: ./ai-mock
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-startmate}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-startmate}
      STARTMATE_AI_CHAT_REQUEST_QUEUE: ${STARTMATE_AI_CHAT_REQUEST_QUEUE:-chat.request}
      STARTMATE_AI_CHAT_RESPONSE_QUEUE: ${STARTMATE_AI_CHAT_RESPONSE_QUEUE:-chat.response}

  backend:
    build:
      context: ./backend
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-startmate}?useSSL=false&serverTimezone=${TZ:-Asia/Seoul}&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-startmate}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-startmate}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_OPEN_IN_VIEW: ${SPRING_JPA_OPEN_IN_VIEW:-false}
      # TLS는 nginx에서 종료되므로, 백엔드가 X-Forwarded-* 헤더로 원래 https 스킴을 인식하게 함
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SPRING_RABBITMQ_HOST: ${SPRING_RABBITMQ_HOST:-rabbitmq}
      SPRING_RABBITMQ_PORT: ${SPRING_RABBITMQ_PORT:-5672}
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-startmate}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-startmate}
      STARTMATE_AI_CHAT_REQUEST_QUEUE: ${STARTMATE_AI_CHAT_REQUEST_QUEUE:-chat.request}
      STARTMATE_AI_CHAT_RESPONSE_QUEUE: ${STARTMATE_AI_CHAT_RESPONSE_QUEUE:-chat.response}
      DATA_GO_KR_SERVICE_KEY: ${DATA_GO_KR_SERVICE_KEY:-}
      BIZINFO_API_KEY: ${BIZINFO_API_KEY:-}
      YOUTH_CENTER_API_KEY: ${YOUTH_CENTER_API_KEY:-}
      STARTMATE_INTERNAL_TOOL_TOKEN: ${STARTMATE_INTERNAL_TOOL_TOKEN:-startmate-local-internal-token}
      STARTMATE_COMMERCIAL_AREA_CSV_PATH: ${STARTMATE_COMMERCIAL_AREA_CSV_PATH:-/data/commercial-area/commercial_area.zip}
    volumes:
      - ${STARTMATE_COMMERCIAL_AREA_DATA_DIR:-./backend/data/raw}:/data/commercial-area:ro
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 서버: 기본값 /etc/letsencrypt(인증서 있음) -> HTTPS 모드.
      # 로컬: .env에 LETSENCRYPT_DIR=./frontend/certs-local 처럼 빈 폴더를 지정하면 HTTP 모드로 동작.
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro

volumes:
  mysql-data:

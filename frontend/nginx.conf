# HTTP: redirect everything to HTTPS
server {
  listen 80;
  server_name h14k001.p.ssafy.io;

  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS: TLS terminates here, serves the SPA and proxies /api to backend
server {
  listen 443 ssl;
  http2 on;
  server_name h14k001.p.ssafy.io;

  ssl_certificate     /etc/letsencrypt/live/h14k001.p.ssafy.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/h14k001.p.ssafy.io/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
